name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run coverage run --branch -m unittest discover

      - name: Coverage report
        run: uv run coverage report -m

      - name: CRAP report
        run: |
          uv run coverage json -o coverage.json
          uv run radon cc . -j -O cc.json
          uv run python calc_crap.py --no-color --threshold 60
