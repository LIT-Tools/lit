name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_dir: windows
            binary_name: lit.exe
            asset_name: lit-windows.zip
          - os: ubuntu-latest
            dist_dir: linux
            binary_name: lit
            asset_name: lit-linux.tar.gz
          - os: macos-latest
            dist_dir: macos
            binary_name: lit
            asset_name: lit-macos.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build binary with PyInstaller
        run: uv run pyinstaller --noconfirm lit.spec --distpath dist/${{ matrix.dist_dir }}

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: .\dist\windows\lit.exe --version

      - name: Verify binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.dist_dir }}/${{ matrix.binary_name }} --version

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\windows\lit.exe" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset_name }}" -C "dist/${{ matrix.dist_dir }}" "${{ matrix.binary_name }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ matrix.asset_name }}" --clobber
