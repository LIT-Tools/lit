[project]
name = "lit"
version = "1.1.0"
description = "Tool for quickly filling work logs in Jira via CLI"
authors = [
    { name = "LEXX", email = "s_kushnarev@rambler.ru" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "prompt-toolkit>=3.0.50,<4.0.0",
    "jira>=3.8.0,<4.0.0",
    "tzlocal>=5.3,<6.0",
    "beautifulsoup4>=4.13.3,<5.0.0",
    "questionary>=2.1.0,<3.0.0",
]

[project.scripts]
lit = "lit:main"

[dependency-groups]
dev = [
    "coverage>=7.6.12,<8.0.0",
    "pyinstaller==6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "lit.py",
    "parser.py",
    "push.py",
    "utils.py",
    "init.py",
    "import_jira.py",
    "import_gitlab.py",
]